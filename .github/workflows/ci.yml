name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only reads the repo, builds, and tests. No write scopes.
permissions:
  contents: read

jobs:
  verify:
    name: typecheck-lint-test-build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The Sanity Studio manifest is re-extracted only when its inputs change
      # (scripts/sanity-manifest.mjs keeps an input hash next to node_modules).
      - name: Cache Sanity manifest
        uses: actions/cache@v4
        with:
          path: |
            public/studio/static
            node_modules/.cache/sanity-manifest
          key: sanity-manifest-${{ hashFiles('sanity/**', 'sanity.config.ts', 'sanity.cli.ts', 'pnpm-lock.yaml') }}

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: nkspfk4b
          NEXT_PUBLIC_SANITY_DATASET: production
          NEXT_PUBLIC_SANITY_API_VERSION: "2025-01-01"
        run: pnpm test

      # `pnpm build` self-skips the Sanity schema deploy when SANITY_AUTH_TOKEN
      # is unset (scripts/sanity-schema-deploy.mjs) — CI never sets it, so the
      # build is side-effect-free.
      - name: Build
        env:
          NEXT_PUBLIC_SITE_URL: https://kunanonj.com
          NEXT_PUBLIC_SANITY_PROJECT_ID: nkspfk4b
          NEXT_PUBLIC_SANITY_DATASET: production
          NEXT_PUBLIC_SANITY_API_VERSION: "2025-01-01"
        run: pnpm build

      # Reuses the .next from the Build step above (same job, repo-root cwd).
      # Fails if any route's first-load JS exceeds its budget (200 KB default;
      # 255 KB marketing; see scripts/check-first-load-budget.mjs).
      - name: Perf budget
        run: pnpm perf:budget

  e2e-smoke:
    name: e2e-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The Sanity Studio manifest is re-extracted only when its inputs change
      # (scripts/sanity-manifest.mjs keeps an input hash next to node_modules).
      - name: Cache Sanity manifest
        uses: actions/cache@v4
        with:
          path: |
            public/studio/static
            node_modules/.cache/sanity-manifest
          key: sanity-manifest-${{ hashFiles('sanity/**', 'sanity.config.ts', 'sanity.cli.ts', 'pnpm-lock.yaml') }}

      # Cache the Chromium binary so warm runs skip the ~120MB download.
      # --with-deps below stays (idempotent) to install system libs on a hit.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        env:
          NEXT_PUBLIC_SITE_URL: https://kunanonj.com
          NEXT_PUBLIC_SANITY_PROJECT_ID: nkspfk4b
          NEXT_PUBLIC_SANITY_DATASET: production
          NEXT_PUBLIC_SANITY_API_VERSION: "2025-01-01"
        run: pnpm build

      # CI=true flips reuseExistingServer off, so Playwright manages its own
      # server via PLAYWRIGHT_WEB_SERVER ("pnpm start" = prod, not dev). The
      # explicit spec paths leave visual.spec.ts to the `visual` job below;
      # --project=desktop scopes to one Chromium engine. a11y.spec.ts scans
      # every route in dark and light themes.
      - name: Run smoke + a11y e2e (desktop)
        env:
          CI: "true"
          PLAYWRIGHT_WEB_SERVER: pnpm start
          NEXT_PUBLIC_SITE_URL: https://kunanonj.com
          NEXT_PUBLIC_SANITY_PROJECT_ID: nkspfk4b
          NEXT_PUBLIC_SANITY_DATASET: production
          NEXT_PUBLIC_SANITY_API_VERSION: "2025-01-01"
        run: pnpm exec playwright test smoke.spec.ts a11y.spec.ts --project=desktop

  # Full-page visual baselines (tests/e2e/visual.spec.ts): every public route,
  # mobile + desktop, light + dark, in the pinned Playwright image so local
  # Docker runs and CI render identically. Uploads the snapshots and any
  # diffs as an artifact for review.
  visual:
    name: visual
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Sanity manifest
        uses: actions/cache@v4
        with:
          path: |
            public/studio/static
            node_modules/.cache/sanity-manifest
          key: sanity-manifest-${{ hashFiles('sanity/**', 'sanity.config.ts', 'sanity.cli.ts', 'pnpm-lock.yaml') }}

      - name: Build
        env:
          NEXT_PUBLIC_SITE_URL: https://kunanonj.com
          NEXT_PUBLIC_SANITY_PROJECT_ID: nkspfk4b
          NEXT_PUBLIC_SANITY_DATASET: production
          NEXT_PUBLIC_SANITY_API_VERSION: "2025-01-01"
        run: pnpm build

      - name: Visual regression (mobile + desktop, light + dark)
        env:
          CI: "true"
          PLAYWRIGHT_WEB_SERVER: pnpm start
          NEXT_PUBLIC_SITE_URL: https://kunanonj.com
          NEXT_PUBLIC_SANITY_PROJECT_ID: nkspfk4b
          NEXT_PUBLIC_SANITY_DATASET: production
          NEXT_PUBLIC_SANITY_API_VERSION: "2025-01-01"
        run: pnpm exec playwright test visual.spec.ts --project=mobile --project=desktop

      - name: Upload snapshots and diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-snapshots
          path: |
            tests/e2e/visual.spec.ts-snapshots/
            test-results/
          retention-days: 7

  # SEO parity: every URL in the migration reference crawl must keep its
  # status, redirect, head tags and text bodies (scripts/start-gates.mjs).
  # Smoke, axe and visual run in the jobs above.
  parity:
    name: parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          NEXT_PUBLIC_SITE_URL: https://kunanonj.com
          NEXT_PUBLIC_SANITY_PROJECT_ID: nkspfk4b
          NEXT_PUBLIC_SANITY_DATASET: production
          NEXT_PUBLIC_SANITY_API_VERSION: "2025-01-01"
        run: pnpm build

      - name: Parity diff against the reference crawl
        run: node scripts/start-gates.mjs --parity-only
