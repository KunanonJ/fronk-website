name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only reads the repo, builds, and tests. No write scopes.
permissions:
  contents: read

# Actions are pinned to commit SHAs, since a tag can be moved; Dependabot's
# github-actions updates move the SHA and its version comment together. The
# Playwright image is pinned to its digest (bump it by hand with
# @playwright/test, see .github/dependabot.yml).

jobs:
  verify:
    name: typecheck-lint-test-build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The Sanity Studio manifest is re-extracted only when its inputs change
      # (scripts/sanity-manifest.mjs keeps an input hash next to node_modules).
      - name: Cache Sanity manifest
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            public/studio/static
            node_modules/.cache/sanity-manifest
          key: sanity-manifest-${{ hashFiles('sanity/**', 'sanity.config.ts', 'sanity.cli.ts', 'pnpm-lock.yaml') }}

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      # Unused files, exports and dependencies (knip.json).
      - name: Unused code
        run: pnpm knip

      - name: Test
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: nkspfk4b
          NEXT_PUBLIC_SANITY_DATASET: production
          NEXT_PUBLIC_SANITY_API_VERSION: "2025-01-01"
        run: pnpm test

      # `pnpm build` self-skips the Sanity schema deploy when SANITY_AUTH_TOKEN
      # is unset (scripts/sanity-schema-deploy.mjs) — CI never sets it, so the
      # build is side-effect-free.
      - name: Build
        env:
          NEXT_PUBLIC_SITE_URL: https://kunanonj.com
          NEXT_PUBLIC_SANITY_PROJECT_ID: nkspfk4b
          NEXT_PUBLIC_SANITY_DATASET: production
          NEXT_PUBLIC_SANITY_API_VERSION: "2025-01-01"
        run: pnpm build

      # Reuses dist/ from the Build step above (same job, repo-root cwd), and
      # serves it with `vite preview` to measure the pages rendered on request
      # (/resume, /learn) as well. Fails if any page's first-load JS,
      # stylesheets or preloaded fonts exceed their budgets (165 KB, or 200 KB
      # for marketing pages; 36 KB; 52 KB: scripts/check-first-load-budget.mjs).
      - name: Perf budget
        run: pnpm perf:budget

  e2e-smoke:
    name: e2e-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The Sanity Studio manifest is re-extracted only when its inputs change
      # (scripts/sanity-manifest.mjs keeps an input hash next to node_modules).
      - name: Cache Sanity manifest
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            public/studio/static
            node_modules/.cache/sanity-manifest
          key: sanity-manifest-${{ hashFiles('sanity/**', 'sanity.config.ts', 'sanity.cli.ts', 'pnpm-lock.yaml') }}

      # Cache the Chromium binary so warm runs skip the ~120MB download.
      # --with-deps below stays (idempotent) to install system libs on a hit.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        env:
          NEXT_PUBLIC_SITE_URL: https://kunanonj.com
          NEXT_PUBLIC_SANITY_PROJECT_ID: nkspfk4b
          NEXT_PUBLIC_SANITY_DATASET: production
          NEXT_PUBLIC_SANITY_API_VERSION: "2025-01-01"
        run: pnpm build

      # CI=true flips reuseExistingServer off, so Playwright manages its own
      # server via PLAYWRIGHT_WEB_SERVER ("pnpm start" = prod, not dev). The
      # explicit spec paths leave visual.spec.ts to the `visual` job below;
      # --project=desktop scopes to one Chromium engine. a11y.spec.ts scans
      # every route in dark and light themes.
      - name: Run smoke + a11y e2e (desktop)
        env:
          CI: "true"
          PLAYWRIGHT_WEB_SERVER: pnpm start
          NEXT_PUBLIC_SITE_URL: https://kunanonj.com
          NEXT_PUBLIC_SANITY_PROJECT_ID: nkspfk4b
          NEXT_PUBLIC_SANITY_DATASET: production
          NEXT_PUBLIC_SANITY_API_VERSION: "2025-01-01"
        run: pnpm exec playwright test smoke.spec.ts a11y.spec.ts --project=desktop

  # Full-page visual baselines (tests/e2e/visual.spec.ts): every public route,
  # mobile + desktop, light + dark, in the pinned Playwright image so local
  # Docker runs and CI render identically. Uploads the snapshots and any
  # diffs as an artifact for review.
  visual:
    name: visual
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      options: --ipc=host

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Sanity manifest
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            public/studio/static
            node_modules/.cache/sanity-manifest
          key: sanity-manifest-${{ hashFiles('sanity/**', 'sanity.config.ts', 'sanity.cli.ts', 'pnpm-lock.yaml') }}

      - name: Build
        env:
          NEXT_PUBLIC_SITE_URL: https://kunanonj.com
          NEXT_PUBLIC_SANITY_PROJECT_ID: nkspfk4b
          NEXT_PUBLIC_SANITY_DATASET: production
          NEXT_PUBLIC_SANITY_API_VERSION: "2025-01-01"
        run: pnpm build

      - name: Visual regression (mobile + desktop, light + dark)
        env:
          CI: "true"
          PLAYWRIGHT_WEB_SERVER: pnpm start
          NEXT_PUBLIC_SITE_URL: https://kunanonj.com
          NEXT_PUBLIC_SANITY_PROJECT_ID: nkspfk4b
          NEXT_PUBLIC_SANITY_DATASET: production
          NEXT_PUBLIC_SANITY_API_VERSION: "2025-01-01"
        run: pnpm exec playwright test visual.spec.ts --project=mobile --project=desktop

      # Profile redesign pages, live since the Phase 6 cutover (Home, the
      # portfolio, the case pages, About and Contact; tests/e2e/profile*):
      # the device matrix, an iPhone-class WebKit phone and the best-practice
      # checks.
      - name: Profile pages (device matrix, WebKit phone, best practices)
        # Runs even when the screenshot step fails, so one run reports (and
        # uploads) both sets of baselines. Its own output folder: Playwright
        # empties its output folder at the start, which would delete the
        # screenshot step's actual and diff images before the upload.
        if: ${{ !cancelled() }}
        env:
          CI: "true"
          PLAYWRIGHT_WEB_SERVER: pnpm start
          NEXT_PUBLIC_SITE_URL: https://kunanonj.com
          NEXT_PUBLIC_SANITY_PROJECT_ID: nkspfk4b
          NEXT_PUBLIC_SANITY_DATASET: production
          NEXT_PUBLIC_SANITY_API_VERSION: "2025-01-01"
        run: pnpm exec playwright test tests/e2e/profile --project=desktop --project=fold-closed --project=fold-open --project=tablet-landscape --project=webkit-phone --output=test-results/profile

      - name: Upload snapshots and diffs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-snapshots
          path: |
            tests/e2e/visual.spec.ts-snapshots/
            tests/e2e/profile*.spec.ts-snapshots/
            test-results/
          retention-days: 7

  # SEO parity: every URL in the migration reference crawl must keep its
  # status, redirect, head tags and text bodies (scripts/start-gates.mjs).
  # Smoke, axe and visual run in the jobs above.
  parity:
    name: parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      options: --ipc=host

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          NEXT_PUBLIC_SITE_URL: https://kunanonj.com
          NEXT_PUBLIC_SANITY_PROJECT_ID: nkspfk4b
          NEXT_PUBLIC_SANITY_DATASET: production
          NEXT_PUBLIC_SANITY_API_VERSION: "2025-01-01"
        run: pnpm build

      - name: Parity diff against the reference crawl
        run: node scripts/start-gates.mjs --parity-only
