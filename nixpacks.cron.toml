# Lightweight build for the cron-only Railway service.
# In Railway → cron service → Variables: NIXPACKS_CONFIG_FILE=nixpacks.cron.toml
# No Next.js build — only Node + the revalidate script.

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["echo 'cron service: no package install required'"]

[phases.build]
cmds = ["echo 'cron service: skipping next build'"]

[start]
cmd = "node scripts/cron-revalidate.mjs"
