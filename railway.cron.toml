# Config-as-code for the cron Railway service (NOT the web app).
# In Railway → cron service → Settings → Config file path: railway.cron.toml
#
# Also set:
#   NIXPACKS_CONFIG_FILE=nixpacks.cron.toml
#   CRON_SECRET=<same as web service>
#   CRON_ENDPOINT_URL=https://<your-domain>/api/cron/revalidate
#   Settings → Cron schedule: 0 * * * *  (hourly, UTC)

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "node scripts/cron-revalidate.mjs"
restartPolicyType = "NEVER"
